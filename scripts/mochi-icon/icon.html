<style>
:root{--head:#F5953A;--cap:#F5953A;--body:#F5953A;--stripe:#D9772A;--bstripe:#D9772A;--tail:#F5953A;--white:#FFFFFF;--ink:#3B2A20;--ear:#F7B4B4}
html,body{margin:0;padding:0;width:1024px;height:1024px;overflow:hidden}
#bg{position:absolute;inset:0;width:1024px;height:1024px}
svg{position:absolute;left:52px;top:52px;width:920px;height:920px;overflow:visible}
.head{fill:var(--head)}.cap{fill:var(--cap)}.body{fill:var(--body)}.stripe{fill:var(--stripe)}.bstripe{fill:var(--bstripe)}.wh{fill:var(--white)}
.ink{fill:var(--ink)}.inkS{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ear{fill:var(--ear)}.blush{fill:#F28B8B;opacity:.45}
.tailS{stroke:var(--tail);fill:none;stroke-width:16;stroke-linecap:round}.tailTip{stroke:var(--white);fill:none;stroke-width:16;stroke-linecap:round}
.armS{stroke:var(--body);fill:none;stroke-width:15;stroke-linecap:round}
.outline{stroke:rgba(59,42,32,.12);stroke-width:1.2}
.arm{transform:rotate(var(--r));transform-origin:0 0}
/* Watch: watchOS masks to a circle, so keep the cat well inside it */
body.watch svg{left:132px;top:132px;width:760px;height:760px}
body.tinted svg{filter:grayscale(1)}
