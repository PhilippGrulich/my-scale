name: MyOpenScaleApp
options:
  bundleIdPrefix: com.philippgrulich.myopenscale
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Built with Xcode 27 / the iOS 27 + watchOS 27 SDKs. Deployment targets stay
  # at iOS 26 / watchOS 11 so existing devices keep working.
  xcodeVersion: "27.0"
  developmentLanguage: en

settings:
  base:
    # App targets stay in Swift 5 language mode for now: the CoreBluetooth /
    # HealthKit callback code isn't strict-concurrency clean yet. The pure
    # MyOpenScaleCore package already builds in Swift 6 mode.
    SWIFT_VERSION: "5.0"
    # English source strings, German translation (Localization/Localizable.xcstrings
    # + per-target InfoPlist.xcstrings).
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  MyOpenScaleCore:
    # Local SwiftPM package living at the repo root (Package.swift).
    path: .

targets:
  MyOpenScaleApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
      - path: Shared
      - path: Localization
    dependencies:
      - package: MyOpenScaleCore
        product: MyOpenScaleCore
      - target: MyOpenScaleControls
        embed: true
      - target: MyOpenScaleWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philippgrulich.myopenscale.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Hand-authored Info.plist (at repo root, outside the App sources glob).
        # Needed for the UIBackgroundModes array, which the generated-plist
        # INFOPLIST_KEY_* settings can't express. Usage strings + scene/launch
        # config live there now.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8M2DN93YKC
    entitlements:
      path: App/MyOpenScaleApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.philippgrulich.myopenscale

  # Control Center control + Home/Lock-Screen widget. WidgetKit controls/widgets
  # must live in a widget extension; it shares StartMeasurementIntent / the widget
  # snapshot with the app via the Shared sources + App Group.
  MyOpenScaleControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Controls
      - path: Shared
      - path: Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philippgrulich.myopenscale.app.controls
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Controls/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8M2DN93YKC
    entitlements:
      path: Controls/MyOpenScaleControls.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.philippgrulich.myopenscale

  # Standalone watchOS app: scans the scale directly over BLE (foreground-only,
  # no allowDuplicates / no background — watchOS constraints), computes body
  # composition with the shared MyOpenScaleCore, and writes to the watch's own
  # HealthKit (which syncs back to the phone). Reuses App/HealthKitSink.swift
  # verbatim (it's watchOS-clean). No App Group — those don't cross the
  # phone<->watch boundary.
  MyOpenScaleWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
      - path: App/HealthKitSink.swift
      - path: Localization
      - path: Shared/WatchSyncPayload.swift
      # Mochi's drawing, bubble, state store and lines are shared with the
      # phone; the watch has its own small coordinator (Watch/WatchMochi.swift).
      - path: App/Mochi/MochiView.swift
      - path: App/Mochi/MochiProps.swift
      - path: App/Mochi/MochiSpeechBubble.swift
      - path: App/Mochi/MochiStores.swift
      - path: App/Mochi/MochiLines-en.json
      - path: App/Mochi/MochiLines-de.json
    dependencies:
      - package: MyOpenScaleCore
        product: MyOpenScaleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philippgrulich.myopenscale.app.watchkitapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Watch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8M2DN93YKC
    entitlements:
      path: Watch/MyOpenScaleWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
